[pytest]
# Anchors pytest's rootdir at demo-api/ and puts it on sys.path, so a bare
# `pytest` invocation from this directory can resolve `from app... import`
# the same way `python -m pytest` already can. Without this, tests/conftest.py
# fails to collect with "ModuleNotFoundError: No module named 'app'" because
# tests/ has no __init__.py and nothing else pins rootdir/sys.path.
pythonpath = .
testpaths = tests
