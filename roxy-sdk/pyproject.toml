[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roxy-guard"
version = "0.1.0"
description = "Trazabilidad y control de acceso para flujos de agentes que consumen MCPs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "team-3 — Platanus Hack 26" }]
keywords = ["ai", "agents", "security", "mcp", "a2a", "langchain", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31,<3.0",
    "langchain-core>=0.3,<1.0",
]

[project.urls]
Homepage = "https://github.com/platanus-hack/platanus-hack-26-co-team-3"
Repository = "https://github.com/platanus-hack/platanus-hack-26-co-team-3"

[project.optional-dependencies]
a2a = ["langsmith>=0.1,<1.0"]
dev = ["pytest>=8.0,<9.0", "requests-mock>=1.12,<2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/roxy"]
