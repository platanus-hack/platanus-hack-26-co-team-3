services:
  mongo:
    image: mongo:7
    container_name: roxy-mongo
    ports:
      - "27017:27017"
    volumes:
      - roxy-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roxy-mongo-data:
