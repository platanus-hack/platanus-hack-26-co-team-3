services:
  - type: web
    name: roxy-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: roxy
      - key: EVALUATOR_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_BASE_URL
        value: https://api.anthropic.com
      - key: DASHBOARD_URL
        sync: false
