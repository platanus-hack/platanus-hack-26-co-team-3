services:
  - type: web
    name: roxy-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: roxy
      - key: EVALUATOR_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
